# Andarz — Gradle properties
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off: the K8.4 guard tasks inspect the project/dependency graph (D-M26).
org.gradle.configuration-cache=false

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# No build-time dependency on Google Play Services or Firebase anywhere (law 1, K2).
# BuildConfig is enabled per module in its own build file, not globally (AGP 8.7 deprecates the global flag).
android.enableR8.fullMode=true
