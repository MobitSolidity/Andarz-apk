name: verify

# Throw-away verification workflow for branches named ci/**. It exists only to compile, test and package
# the app on GitHub's runners while the sandbox that edits the code has no route to Gradle or Maven.
# It is NOT part of the project (decision D-87: no CI pipeline) and is never merged into main.

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  KOTLIN_ARGS: -Pkotlin.compiler.execution.strategy=in-process

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace $KOTLIN_ARGS
      - name: List outputs
        if: always()
        run: find app/build/outputs -name '*.apk' -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andarz-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests of every module
        run: |
          chmod +x gradlew
          ./gradlew :engine:test :data:testDebugUnitTest :market:testDebugUnitTest :app:testDebugUnitTest --continue --stacktrace $KOTLIN_ARGS
      - name: Test report summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot = fail = err = skip = 0
          bad = []
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              r = ET.parse(f).getroot()
              tot += int(r.get('tests', 0)); fail += int(r.get('failures', 0)); err += int(r.get('errors', 0)); skip += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  for k in ('failure', 'error'):
                      e = tc.find(k)
                      if e is not None:
                          bad.append((tc.get('classname'), tc.get('name'), (e.get('message') or '')[:400]))
          print(f'TESTS total={tot} failures={fail} errors={err} skipped={skip}')
          for b in bad:
              print('FAILED', b[0], b[1], '::', b[2])
          PY

  guards-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build guards (K8.4)
        run: |
          chmod +x gradlew
          ./gradlew verifyGuards --stacktrace $KOTLIN_ARGS
      - name: Lint
        run: ./gradlew :app:lintRelease :data:lintRelease :market:lintRelease --continue --stacktrace $KOTLIN_ARGS
