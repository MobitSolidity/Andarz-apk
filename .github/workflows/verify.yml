name: verify-debug
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  KOTLIN_ARGS: -Pkotlin.compiler.execution.strategy=in-process
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug test
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'ir.andarz.app.ui.DebugEyeTest' --tests 'ir.andarz.app.ui.NarrowPhoneLayoutTest' --continue $KOTLIN_ARGS || true
      - name: Dump report
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              r = ET.parse(f).getroot()
              for tc in r.iter('testcase'):
                  for k in ('failure', 'error'):
                      e = tc.find(k)
                      if e is not None:
                          print('=====', tc.get('classname'), tc.get('name'))
                          print(e.get('message') or '')
                          print((e.text or '')[:3000])
          PY
